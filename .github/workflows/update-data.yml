name: Update SKDFE Data

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GUI Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: 'gui-repo'

      - name: Checkout SKDFE Repository
        uses: actions/checkout@v4
        with:
          repository: 'aznoobnam/skdfe'
          path: 'skdfe-repo'

      - name: Copy Data Files
        run: |
          mkdir -p gui-repo/public/data
          cp skdfe-repo/*.json gui-repo/public/data/ || true
          cp skdfe-repo/*.csv gui-repo/public/data/ || true

      - name: Commit and Push Changes
        run: |
          cd gui-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No changes in data files to commit."
          else
            git commit -m "chore(data): auto-update SKDFE data"
            git push
          fi
